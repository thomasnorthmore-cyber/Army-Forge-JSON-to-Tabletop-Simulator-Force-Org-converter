name = "army-forge-force-org-converter"
main = "src/worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "ARMIES"
id = "REPLACE_WITH_NEW_KV_NAMESPACE_ID"

[vars]
REQUIRE_RATE_LIMITS = "true"

[[ratelimits]]
name = "CLIENT_LIMIT"
namespace_id = "58362031"
[ratelimits.simple]
limit = 30
period = 60

[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "58362032"
[ratelimits.simple]
limit = 120
period = 60
